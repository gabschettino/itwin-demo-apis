services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:backend:watch
    working_dir: /app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    working_dir: /app
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_DEV_BACKEND_URL=http://backend:3001
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
